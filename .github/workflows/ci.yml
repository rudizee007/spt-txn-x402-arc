name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: gofmt · vet · build · test (default build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      # gofmt -l lists offending files but exits 0, so it must be asserted
      # explicitly.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -count=1 -race

      # The guard is the trust boundary and it is pure standard library.
      # Coverage below 100% means an assertion exists that no test exercises.
      - name: settle/evm coverage must be 100%
        run: |
          go test ./settle/evm/ -count=1 -coverprofile=cover.out
          pct=$(go tool cover -func=cover.out | awk '/^total:/ {print $3}')
          echo "settle/evm coverage: $pct"
          [ "$pct" = "100.0%" ] || { echo "::error::guard coverage regressed to $pct" >&2; exit 1; }

  arc-path:
    name: settlement command (-tags arc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      # The trust boundary forbids C, including via cgo. go-ethereum links C
      # libsecp256k1 when cgo is on, so cmd/payarc/nocgo.go makes that build
      # fail on purpose. Assert the guard actually guards — a compile error
      # nobody checks for is a compile error somebody will delete.
      - name: cgo build MUST fail
        run: |
          if CGO_ENABLED=1 go build -tags arc ./cmd/payarc 2>/dev/null; then
            echo "::error::cmd/payarc built with cgo enabled; the nocgo guard is gone" >&2
            exit 1
          fi
          echo "cgo build refused, as designed"

      - name: build and vet with cgo off
        env:
          CGO_ENABLED: "0"
        run: |
          gofmt_out=$(gofmt -l ./cmd/payarc)
          [ -z "$gofmt_out" ] || { echo "::error::not gofmt-clean: $gofmt_out" >&2; exit 1; }
          go vet -tags arc ./...
          go build -tags arc ./...

      # Every adversarial mode, offline, ephemeral key, nothing broadcast.
      # A mode refused by the WRONG control fails this step.
      - name: adversarial selftest
        env:
          CGO_ENABLED: "0"
        run: go run -tags arc ./cmd/payarc -selftest

  fuzz:
    name: fuzz the guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      - run: go test ./settle/evm/ -run=NONE -fuzz=FuzzDecodeTransfer -fuzztime=60s
      - run: go test ./settle/evm/ -run=NONE -fuzz=FuzzVerify -fuzztime=60s

  security:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      # CGO_ENABLED=0 is not optional here. govulncheck type-checks the
      # packages it scans, so scanning `-tags arc` with cgo on hits
      # cmd/payarc/nocgo.go's deliberate compile error and the job dies with
      # "undefined: payarcRequiresCGO_ENABLED_0_seeThisFile" rather than a
      # vulnerability report. Every tool pointed at the tagged path — gopls,
      # staticcheck, an IDE — needs the same.
      - name: govulncheck
        env:
          CGO_ENABLED: "0"
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)"/bin/govulncheck ./...
          "$(go env GOPATH)"/bin/govulncheck -tags arc ./...

# TODO(supply-chain): pin these actions to commit SHAs — tag refs are mutable.
#   go install github.com/suzuki-shunsuke/pinact/cmd/pinact@latest
#   pinact run .github/workflows/*.yml
